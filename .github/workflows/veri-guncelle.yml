name: Veri güncelle

on:
  schedule:
    - cron: "15 3 * * *"        # Her gün 06:15 (TSİ): KEV + EPSS + haberler
    - cron: "15 9,15,21 * * *"  # Gün içinde 3 kez daha: yalnızca haberler
  workflow_dispatch: {}          # Actions sekmesinden elle çalıştırma

permissions:
  contents: write                # yalnızca bu depoya veri işlemek için

concurrency:
  group: veri-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4  # v4.2.2
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5  # v5.3.0
        with:
          python-version: "3.12"

      - name: Son değişiklikleri al
        run: git pull --rebase

      - name: Bağımlılıkları kur
        run: pip install defusedxml

      - name: KEV + EPSS + CVSS
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 3 * * *'
        run: python scripts/fetch_kev.py

      - name: Haber akışları
        run: python scripts/fetch_news.py

      - name: Değişiklikleri işle
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Veri güncellemesi $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
