name: Kod ve JSON kalite kontrolü

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'schemas/**'
      - 'docs/data/**'
      - 'requirements.txt'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kalite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bağımlılıklar
        run: pip install -r requirements.txt
      - name: Birim testleri
        run: python -m unittest discover -s tests -v
      - name: JSON şema doğrulama
        run: python scripts/validate_json.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: KVKK veri doğrulama
        run: node scripts/validate-kvkk.mjs
